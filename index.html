<!doctype html>
<!-- The home of ActiveMind's share links. Each link is a page below this
     one (trip/ for a day out). Published from web/share in the ActiveMind repo. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ActiveMind</title>
<style>
  :root { --paper: #F7F5F0; --ink: #1a1a1a; --muted: #5e5950; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0E1424; --ink: #FFFFFF; --muted: rgba(255,255,255,0.56); } }
  body { background: var(--paper); color: var(--ink); font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 64px 24px; text-align: center; }
  h1 { font-size: 24px; margin: 0; } p { color: var(--muted); } a { color: var(--muted); }
</style>
</head>
<body>
  <h1>ActiveMind</h1>
  <p>move · think · thrive</p>
  <p>This is where links shared from the app open. If someone sent you one, open that link.</p>
  <p><a href="https://chuybites.github.io/activemind-privacy/">Privacy</a></p>
</body>
</html>
