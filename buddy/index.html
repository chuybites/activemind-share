<!doctype html>
<!--
  An invite to be ActiveMind buddies. Published from web/share (see
  scripts/publish-share-site.sh) to https://chuybites.github.io/activemind-share/buddy/?code=…

  Asks Supabase who sent the invite (get_buddy_invite: the inviter's
  chosen name and emoji, while the invite is live, nothing else) and hands
  the code to the app, where saying yes happens. Written with textContent.
  Colours: the app's Thrive teal (app/tokens.ts), since your circle lives on You.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://idjbuusxzifyleikvlpq.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Join my circle · ActiveMind</title>
<meta name="description" content="An invite to join a circle of friends on ActiveMind.">
<meta property="og:title" content="Join my circle on ActiveMind?">
<meta property="og:description" content="Points, challenges, day trips together and cheers. Never moods, journal or places, and Health numbers only if each of you switches them on.">
<meta name="theme-color" content="#188178">
<style>
  :root {
    --paper: #F7F5F0; --ink: #1a1a1a; --soft: #5f5d59; --muted: #5e5950;
    --card: #FFFFFF; --well: #F2EFE8; --line: #EAE5DB;
    --band: #188178; --on: #FFFFFF; --on-soft: rgba(255,255,255,0.86);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E1424; --ink: #FFFFFF; --soft: rgba(255,255,255,0.6); --muted: rgba(255,255,255,0.56);
      --card: rgba(255,255,255,0.06); --well: rgba(255,255,255,0.08); --line: rgba(255,255,255,0.08);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .band { background: var(--band); color: var(--on); border-radius: 26px; padding: 28px 20px; text-align: center; }
  .face { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.18); display: grid; place-items: center; font-size: 36px; margin: 0 auto; }
  .kicker { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--on-soft); margin-top: 12px; }
  h1 { font-size: 24px; line-height: 1.2; font-weight: 800; letter-spacing: -0.4px; margin-top: 4px; }
  h2 { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: var(--muted); margin: 24px 4px 10px; }
  .list { background: var(--card); border: 0.5px solid var(--line); border-radius: 20px; padding: 4px 16px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 12px 0; font-weight: 600; }
  .row + .row { border-top: 0.5px solid var(--line); }
  .open { display: block; text-align: center; margin-top: 20px; padding: 16px; border-radius: 14px; background: var(--band); color: var(--on); font-weight: 800; text-decoration: none; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }
  .ended { text-align: center; padding: 48px 20px; background: var(--well); border-radius: 20px; margin-top: 24px; }
  .ended .big { font-size: 32px; } .ended h1 { font-size: 20px; margin-top: 8px; } .ended p { color: var(--soft); margin-top: 6px; }
  .skeleton { height: 200px; border-radius: 26px; background: var(--well); }
  footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 28px; } footer a { color: var(--muted); }
</style>
</head>
<body>
<main id="app"><div class="skeleton" aria-label="Loading"></div></main>
<footer>Made with ActiveMind · move · think · thrive<br><a href="https://chuybites.github.io/activemind-privacy/">Privacy</a></footer>
<script>
(function () {
  var SUPABASE = "https://idjbuusxzifyleikvlpq.supabase.co";
  var KEY = "sb_publishable_nVIwYRmyPRuM-0CQ_PRvKw_kiZzC0om";
  var app = document.getElementById("app");
  var code = new URLSearchParams(location.search).get("code") || "";
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = String(text); return n; }
  function str(v, max) { return typeof v === "string" ? v.slice(0, max || 80) : ""; }
  function ended(title, body) {
    app.textContent = "";
    var box = el("div", "ended");
    box.appendChild(el("div", "big", "🤝")); box.appendChild(el("h1", null, title)); box.appendChild(el("p", null, body));
    app.appendChild(box);
  }
  if (!/^[A-Za-z0-9_-]{12}$/.test(code)) { ended("This invite isn't complete", "Ask your friend to send it again."); return; }
  fetch(SUPABASE + "/rest/v1/rpc/get_buddy_invite", {
    method: "POST", headers: { "apikey": KEY, "Content-Type": "application/json" }, body: JSON.stringify({ invite_code: code })
  }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rows) {
      var row = Array.isArray(rows) ? rows[0] : null;
      if (!row) { ended("This invite has ended", "Invites last a week, and each one works once. Ask your friend for a new one."); return; }
      var name = str(row.inviter_name, 40) || "A friend";
      document.title = name + " invited you · ActiveMind";
      app.textContent = "";
      var band = el("section", "band");
      band.appendChild(el("div", "face", str(row.inviter_avatar, 16) || "🌿"));
      band.appendChild(el("div", "kicker", name + " invited you"));
      band.appendChild(el("h1", null, "Join " + name + "'s circle"));
      app.appendChild(band);
      app.appendChild(el("h2", null, "WHAT YOU EACH SEE"));
      var list = el("div", "list");
      [["🪪", "Each other's profile card"], ["🔥", "Your streaks, whether you moved today, and the week's points"], ["👋", "Cheers, notes, plans, postcards and the moments you choose to post"], ["🔒", "Never your moods, journal or places. Steps or a sleep score only if you switch them on"]]
        .forEach(function (x) { var r = el("div", "row"); r.appendChild(el("span", null, x[0])); r.appendChild(el("span", null, x[1])); list.appendChild(r); });
      app.appendChild(list);
      var open = el("a", "open", "Open in ActiveMind to say yes");
      open.href = "activemind://open/screen/buddy-invite?code=" + code;
      app.appendChild(open);
      app.appendChild(el("div", "hint", "You'll need ActiveMind on your iPhone. Either of you can leave any time."));
    })
    .catch(function () { ended("Couldn't load this invite", "Check your connection and try again."); });
})();
</script>
</body>
</html>
